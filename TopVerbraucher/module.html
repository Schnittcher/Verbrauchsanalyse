<style>
    /* Schrift, Schriftgröße, Ränder und Farben kommen von der Visualisierung, nichts davon wird hier überschrieben */
    .tvb {
        --line: color-mix(in srgb, var(--content-color) 14%, transparent);
        --soft: color-mix(in srgb, var(--content-color) 7%, transparent);
        --muted: color-mix(in srgb, var(--content-color) 60%, transparent);
        --up: #e5484d;
        --down: #2fb344;
        display: flex;
        flex-direction: column;
        gap: 0.8em;
        box-sizing: border-box;
        overflow: hidden;
        font-family: inherit;
        font-size: inherit;
        color: var(--content-color);
    }

    .tvb * {
        box-sizing: border-box;
    }

    .tvb-head {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.5em;
    }

    .tvb-chips {
        display: flex;
        gap: 0.4em;
        flex-wrap: wrap;
    }

    .tvb-chip {
        font: inherit;
        font-size: 0.8em;
        color: var(--content-color);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 2em;
        padding: 0.3em 0.9em;
        cursor: pointer;
    }

    .tvb-chip:hover {
        background: var(--soft);
    }

    .tvb-chip.tvb-on {
        background: var(--accent-color);
        border-color: var(--accent-color);
        color: #fff;
        font-weight: 700;
    }

    /* Karten brechen bei wenig Breite in weitere Zeilen um, damit nichts abgeschnitten wird */
    .tvb-cards {
        flex: none;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10em, 1fr));
        gap: 0.6em;
    }

    .tvb-card {
        background: var(--soft);
        border-radius: 1em;
        padding: 0.7em 0.9em;
        min-width: 0;
        overflow-wrap: anywhere;
    }

    .tvb-label {
        font-size: 0.75em;
        color: var(--muted);
    }

    .tvb-big {
        font-size: 1.7em;
        font-weight: 700;
        line-height: 1.2;
    }

    /* Die Kachel zeigt so viel, wie in die Höhe passt. Die Stufe misst fit(): 2 alles, 1 ohne Vergleiche, Kennzahlen und Anteilsmodus, 0 nur Gesamtverbrauch und Liste */
    .tvb[data-level="1"] .tvb-modes,
    .tvb[data-level="1"] .tvb-delta,
    .tvb[data-level="0"] .tvb-modes,
    .tvb[data-level="0"] .tvb-delta,
    .tvb[data-level="0"] .tvb-cost {
        display: none;
    }

    .tvb-delta {
        font-size: 0.75em;
        color: var(--muted);
    }

    .tvb-delta .tvb-up {
        color: var(--up);
        font-weight: 700;
    }

    .tvb-delta .tvb-down {
        color: var(--down);
        font-weight: 700;
    }

    .tvb-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.5em;
        /* Scrollbalken schmal und dezent in den Farben der Visualisierung, Abstand zum Inhalt (standards/TILE_VISUALIZATION.md) */
        padding-right: 0.7em;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--content-color) 30%, transparent) transparent;
    }

    .tvb-list::-webkit-scrollbar {
        width: 0.35em;
    }

    .tvb-list::-webkit-scrollbar-track {
        background: transparent;
    }

    .tvb-list::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--content-color) 30%, transparent);
        border-radius: 0.2em;
    }

    .tvb-list::-webkit-scrollbar-thumb:hover {
        background: var(--accent-color);
    }

    .tvb-row {
        display: flex;
        flex-direction: column;
        gap: 0.25em;
    }

    .tvb-line {
        display: flex;
        align-items: center;
        gap: 0.6em;
    }

    .tvb-group > .tvb-line {
        cursor: pointer;
    }

    .tvb-icon {
        flex: none;
        width: 1.4em;
        height: 1.4em;
        color: var(--c);
    }

    .tvb-icon svg {
        width: 100%;
        height: 100%;
    }

    /* Lange Namen brechen um, statt abgeschnitten zu werden */
    .tvb-name {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
    }

    .tvb-group > .tvb-line .tvb-name {
        font-weight: 700;
    }

    .tvb-value {
        flex: none;
        font-size: 0.9em;
    }

    .tvb-pct {
        flex: none;
        width: 3.6em;
        text-align: right;
        font-size: 0.8em;
        color: var(--muted);
    }

    .tvb-track {
        height: 0.5em;
        border-radius: 0.3em;
        background: var(--soft);
        overflow: hidden;
    }

    .tvb-bar {
        display: flex;
        gap: 2px;
        height: 100%;
        border-radius: 0.3em;
        overflow: hidden;
    }

    .tvb-seg {
        height: 100%;
        background: var(--c);
        opacity: 0.85;
        min-width: 2px;
    }

    .tvb-seg.tvb-rest,
    .tvb-bar.tvb-grey .tvb-seg {
        background: color-mix(in srgb, var(--content-color) 30%, transparent);
    }

    .tvb-children {
        display: none;
        margin-left: 0.7em;
        padding-left: 0.8em;
        border-left: 2px solid var(--line);
        flex-direction: column;
        gap: 0.5em;
    }

    .tvb-open > .tvb-children {
        display: flex;
    }

    .tvb-rest-row .tvb-name,
    .tvb-rest-row .tvb-value {
        color: var(--muted);
    }

    .tvb-note {
        font-size: 0.75em;
        color: var(--muted);
    }

    .tvb-empty {
        padding: 2em 1em;
        text-align: center;
        color: var(--muted);
    }

    /* Hinweise zu den Diagrammen hängen am body, damit weder Scrollbereich noch Kachelrand sie abschneiden */
    .tvb-tip {
        position: fixed;
        display: none;
        z-index: 30;
        pointer-events: none;
        max-width: 18em;
        padding: 0.4em 0.7em;
        border-radius: 0.6em;
        font-family: inherit;
        font-size: 0.8em;
        line-height: 1.4;
        color: var(--content-color);
        background: var(--card-color, #323338);
        border: 1px solid color-mix(in srgb, var(--content-color) 20%, transparent);
        box-shadow: 0 0.3em 1em rgba(0, 0, 0, 0.35);
    }

    .tvb-tip-title {
        font-weight: 700;
    }

    .tvb-hint {
        cursor: default;
    }

    .tvb-action {
        cursor: pointer;
    }

    .tvb-hint:hover {
        filter: brightness(1.25);
    }

    /* Die Kachel scrollt nur in ihrem eigenen Bereich, nie im Dokument (sonst erscheint bei krummen Pixelwerten ein zweiter Rollbalken) */
    html, body { overflow: hidden; }
</style>

<div class="tvb" id="tvb"></div>

<script>
    (function () {
        var root = document.getElementById('tvb');
        var state = null;
        var period = 'today';
        var mode = 'total';
        var open = {};

        // Der Browser-Speicher kann fehlen oder eine Ausnahme werfen, die Kachel funktioniert auch ohne
        try {
            period = localStorage.getItem('tvb.period') || period;
            mode = localStorage.getItem('tvb.mode') || mode;
        } catch (e) {
        }

        // Kleine eingebaute Symbole, damit die Kachel nichts nachladen muss. Unbekannte Namen zeigen einen Punkt.
        var ICONS = {
            server: '<rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01"/>',
            bolt: '<path d="M13 3L4 14h7l-1 7 9-11h-7z"/>',
            home: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
            flame: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
            droplet: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z"/>',
            fridge: '<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M6 10h12M9 6v1M9 13v2"/>',
            plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',
            car: '<path d="M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM7 13h.01M17 13h.01"/>',
            bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11c1 1 1 2 1 4h4c0-2 0-3 1-4a6 6 0 0 0-3-11z"/>',
            wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.500 16.500a5 5 0 0 1 7 0M12 20h.01"/>'
        };

        // Hinweise zu den Diagrammen: erscheinen sofort beim Überfahren und beim Antippen, auch auf Touch-Geräten
        var tip = null;
        var tipTimer = null;
        var tipOwner = null;

        function showTip(lines, event) {
            if (!tip) {
                tip = document.createElement('div');
                tip.className = 'tvb-tip';
                document.body.appendChild(tip);
            }
            tip.textContent = '';
            lines.forEach(function (line, index) {
                tip.appendChild(el('div', index === 0 ? 'tvb-tip-title' : '', line));
            });
            tip.style.display = 'block';
            var x = Math.max(4, Math.min(event.clientX - tip.offsetWidth / 2, window.innerWidth - tip.offsetWidth - 4));
            var y = event.clientY - tip.offsetHeight - 14;
            tip.style.left = x + 'px';
            tip.style.top = (y < 4 ? event.clientY + 18 : y) + 'px';
            clearTimeout(tipTimer);
            tipTimer = setTimeout(hideTip, 4000);
        }

        function hideTip() {
            if (tip) {
                tip.style.display = 'none';
            }
        }

        // Mit einer Aktion öffnet ein Klick die Aktion. Auf Touch-Geräten zeigt das erste Tippen nur den Hinweis, das zweite öffnet.
        function hint(node, linesFn, activate) {
            node.classList.add('tvb-hint');
            var pointerType = 'mouse';
            var wasShown = false;
            ['pointerenter', 'pointermove', 'pointerdown'].forEach(function (name) {
                node.addEventListener(name, function (event) {
                    if (name === 'pointerdown') {
                        pointerType = event.pointerType;
                        wasShown = tipOwner === node && tip !== null && tip.style.display === 'block';
                    }
                    tipOwner = node;
                    showTip(linesFn(), event);
                });
            });
            if (activate) {
                node.classList.add('tvb-action');
                node.addEventListener('click', function () {
                    if (pointerType === 'touch' && !wasShown) {
                        return;
                    }
                    activate();
                });
            }
            node.addEventListener('pointerleave', function (event) {
                // Auf Touch-Geräten endet der Zeiger mit dem Loslassen, der Hinweis bleibt dort bis zum nächsten Tippen
                if (event.pointerType !== 'touch') {
                    hideTip();
                }
            });
        }

        document.addEventListener('pointerdown', function (event) {
            if (!event.target.closest || !event.target.closest('.tvb-hint')) {
                hideTip();
            }
        });
        function el(tag, className, text) {
            var node = document.createElement(tag);
            if (className) {
                node.className = className;
            }
            if (text !== undefined) {
                node.textContent = text;
            }
            return node;
        }

        // Ein Klick öffnet den Archivdialog der Variable, wenn die Einstellung an ist und die Visualisierung die Funktion kennt
        function openable(node) {
            return state.clickOpen === true && node.objectId > 0 && typeof openObject === 'function';
        }

        function fmt(value, digits) {
            return value.toLocaleString(undefined, {minimumFractionDigits: digits, maximumFractionDigits: digits});
        }

        function pct(value) {
            return fmt(value, value < 10 ? 1 : 0) + ' %';
        }

        function icon(name, color) {
            var wrap = el('span', 'tvb-icon');
            wrap.style.setProperty('--c', color);
            var path = ICONS[name] || '<circle cx="12" cy="12" r="4"/>';
            wrap.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
            return wrap;
        }

        // Fenster- und Kachelhöhe: Die Kachel füllt den Platz innerhalb der Ränder, die die Visualisierung am body setzt
        function fit() {
            var style = getComputedStyle(document.body);
            var space = parseFloat(style.marginTop) + parseFloat(style.marginBottom);
            root.style.height = Math.max(0, window.innerHeight - space) + 'px';
            // Der Liste sollen mindestens etwa drei Zeilen bleiben, sonst wird die nächste Stufe gewählt
            var list = root.querySelector('.tvb-list');
            var minList = (parseFloat(getComputedStyle(root).fontSize) || 15) * 7;
            for (var level = 2; level >= 0; level--) {
                root.setAttribute('data-level', String(level));
                if (!list || list.clientHeight >= minList) {
                    break;
                }
            }
        }

        function delta(now, before, texts) {
            var box = el('div', 'tvb-delta');
            if (!before) {
                box.textContent = ' ';
                return box;
            }
            var change = (now - before) / before * 100;
            var up = change > 0;
            var arrow = el('span', up ? 'tvb-up' : 'tvb-down', (up ? '▲ ' : '▼ ') + fmt(Math.abs(change), 0) + ' %');
            box.appendChild(arrow);
            box.appendChild(document.createTextNode(' ' + texts.previous));
            return box;
        }

        function buildRow(node, data, color, parentColor) {
            var isGroup = node.children.length > 0;
            var rowColor = node.color || parentColor || color;
            var row = el('div', 'tvb-row' + (isGroup ? ' tvb-group' : '') + (node.type === 'rest' ? ' tvb-rest-row' : ''));
            if (open[node.id]) {
                row.classList.add('tvb-open');
            }

            var line = el('div', 'tvb-line');
            if (node.type !== 'rest' && node.type !== 'others') {
                line.appendChild(icon(node.icon || '', rowColor));
            }
            line.appendChild(el('span', 'tvb-name', node.name));
            line.appendChild(el('span', 'tvb-value', fmt(node.value, data.digits) + ' ' + data.unit));
            var share = mode === 'group' ? node.shareGroup : node.share;
            line.appendChild(el('span', 'tvb-pct', pct(share)));
            row.appendChild(line);

            var track = el('div', 'tvb-track');
            var bar = el('div', 'tvb-bar');
            bar.style.width = Math.min(100, share) + '%';
            if (isGroup && node.value > 0) {
                // Gruppenbalken sind nach Mitgliedern segmentiert, der Rest der Gruppe ist grau
                node.children.forEach(function (child) {
                    var seg = el('div', 'tvb-seg' + (child.type === 'rest' ? ' tvb-rest' : ''));
                    seg.style.width = (child.value / node.value * 100) + '%';
                    seg.style.setProperty('--c', child.color || rowColor);
                    hint(seg, function () {
                        var lines = [child.name, fmt(child.value, data.digits) + ' ' + data.unit,
                            fmt(child.shareGroup, 0) + ' ' + state.texts.ofGroup, fmt(child.share, 0) + ' ' + state.texts.ofTotal];
                        return openable(child) ? lines.concat([state.texts.openHint]) : lines;
                    }, openable(child) ? function () { openObject(child.objectId); } : null);
                    bar.appendChild(seg);
                });
            } else {
                var seg = el('div', 'tvb-seg');
                seg.style.width = '100%';
                seg.style.setProperty('--c', rowColor);
                hint(seg, function () {
                    var lines = [node.name, fmt(node.value, data.digits) + ' ' + data.unit, fmt(node.share, 0) + ' ' + state.texts.ofTotal];
                    return openable(node) ? lines.concat([state.texts.openHint]) : lines;
                }, openable(node) ? function () { openObject(node.objectId); } : null);
                bar.appendChild(seg);
                if (node.type === 'others') {
                    bar.classList.add('tvb-grey');
                }
            }
            track.appendChild(bar);
            row.appendChild(track);

            if (isGroup) {
                var children = el('div', 'tvb-children');
                node.children.forEach(function (child) {
                    children.appendChild(buildRow(child, data, color, rowColor));
                });
                row.appendChild(children);
                line.addEventListener('click', function () {
                    open[node.id] = !open[node.id];
                    row.classList.toggle('tvb-open', !!open[node.id]);
                });
            }
            return row;
        }

        function render() {
            if (!state) {
                return;
            }
            var texts = state.texts;
            var data = state.periods ? state.periods[period] : null;
            root.textContent = '';

            if (!data) {
                root.appendChild(el('div', 'tvb-empty', texts.empty));
                fit();
                return;
            }

            var head = el('div', 'tvb-head');
            var chips = el('div', 'tvb-chips');
            ['today', 'week', 'month', 'year'].forEach(function (key) {
                var chip = el('button', 'tvb-chip' + (key === period ? ' tvb-on' : ''), texts[key]);
                chip.type = 'button';
                chip.addEventListener('click', function () {
                    period = key;
                    try {
                        localStorage.setItem('tvb.period', key);
                    } catch (e) {
                    }
                    render();
                });
                chips.appendChild(chip);
            });
            head.appendChild(chips);

            var modes = el('div', 'tvb-chips tvb-modes');
            [['total', texts.ofTotal], ['group', texts.ofGroup]].forEach(function (entry) {
                var chip = el('button', 'tvb-chip' + (entry[0] === mode ? ' tvb-on' : ''), entry[1]);
                chip.type = 'button';
                chip.addEventListener('click', function () {
                    mode = entry[0];
                    try {
                        localStorage.setItem('tvb.mode', mode);
                    } catch (e) {
                    }
                    render();
                });
                modes.appendChild(chip);
            });
            head.appendChild(modes);
            root.appendChild(head);

            var cards = el('div', 'tvb-cards');
            var total = el('div', 'tvb-card');
            total.appendChild(el('div', 'tvb-label', texts.total));
            total.appendChild(el('div', 'tvb-big', fmt(data.total, state.digits) + ' ' + state.unit));
            total.appendChild(delta(data.total, data.prevTotal, texts));
            // Kennzahlen je Bewohner und je Quadratmeter, wenn die Verbrauchsquellen sie kennen
            var per = [];
            if (data.perResident !== undefined) {
                per.push(fmt(data.perResident, 2) + ' ' + state.unit + ' ' + texts.perResident);
            }
            if (data.perArea !== undefined) {
                per.push(fmt(data.perArea, 3) + ' ' + state.unit + '/m\u00B2');
            }
            if (per.length > 0) {
                total.appendChild(el('div', 'tvb-delta', per.join(' \u00B7 ')));
            }
            cards.appendChild(total);
            var cost = el('div', 'tvb-card tvb-cost');
            cost.appendChild(el('div', 'tvb-label', texts.cost));
            cost.appendChild(el('div', 'tvb-big', fmt(data.cost, 2) + ' €'));
            cost.appendChild(delta(data.cost, data.prevCost, texts));
            cards.appendChild(cost);
            root.appendChild(cards);

            var list = el('div', 'tvb-list');
            data.nodes.forEach(function (node) {
                list.appendChild(buildRow(node, state, 'var(--accent-color)', ''));
            });
            if (data.unrecorded > 0 || data.negative) {
                var share = data.total > 0 ? data.unrecorded / data.total * 100 : 0;
                list.appendChild(buildRow({
                    id: 'unrecorded', type: 'rest', name: texts.unrecorded, value: data.unrecorded,
                    share: share, shareGroup: share, children: []
                }, state, 'var(--accent-color)', ''));
            }
            if (data.negative) {
                list.appendChild(el('div', 'tvb-note', texts.negative));
            }
            root.appendChild(list);
            fit();
        }

        // Wird beim Laden mit den Startdaten und danach bei jeder Änderung vom Modul aufgerufen
        window.handleMessage = function (json) {
            try {
                state = JSON.parse(json);
            } catch (e) {
                return;
            }
            render();
        };

        // Die Visualisierung setzt die Ränder am body eventuell erst nach dem Laden. Deshalb wird die Höhe nach dem Laden
        // und bei jeder Änderung von Rand oder Fenster neu berechnet, sonst ist die Kachel zu hoch und die Seite scrollt.
        window.addEventListener('resize', fit);
        window.addEventListener('load', fit);
        if (window.MutationObserver) {
            new MutationObserver(fit).observe(document.body, {attributes: true, attributeFilter: ['style', 'class']});
        }
        setTimeout(fit, 200);
        fit();
    })();
</script>
